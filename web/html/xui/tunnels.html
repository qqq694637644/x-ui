<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    @media (min-width: 769px) {
        .ant-layout-content {
            margin: 24px 16px;
        }
    }

    .ant-col-sm-24 {
        margin-top: 10px;
    }
</style>
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="spinning" :delay="500" tip="loading">
                <transition name="list" appear>
                    <a-card hoverable style="margin-bottom: 20px;">
                        <a-alert type="info" show-icon message="A 端隧道说明"
                                 description="直连模式由 A 主动连接 B；Portal 模式由无公网 IP 的 B 主动连接 A。Portal 可使用 VMess/mKCP，或 VLESS/XHTTP 经 CDN/Caddy/H3 接入。目标地址始终表示 B 端可访问的地址。"></a-alert>
                    </a-card>
                </transition>
                <transition name="list" appear>
                    <a-card hoverable>
                        <div slot="title">
                            <a-button type="primary" icon="plus" @click="openAddTunnel">添加隧道</a-button>
                            <a-button style="margin-left: 8px" icon="reload" @click="applyTunnels">重新应用</a-button>
                        </div>
                        <a-table :columns="columns" :row-key="tunnel => tunnel.id"
                                 :data-source="tunnels"
                                 :loading="spinning" :scroll="{ x: 1400 }"
                                 :pagination="false"
                                 style="margin-top: 20px">
                            <template slot="action" slot-scope="text, tunnel">
                                <a-dropdown :trigger="['click']">
                                    <a @click="e => e.preventDefault()">操作</a>
                                    <a-menu slot="overlay" @click="a => clickAction(a, tunnel)">
                                        <a-menu-item key="edit">
                                            <a-icon type="edit"></a-icon>编辑
                                        </a-menu-item>
                                        <a-menu-item key="test">
                                            <a-icon type="experiment"></a-icon>测试
                                        </a-menu-item>
                                        <a-menu-item key="delete">
                                            <span style="color: #FF4D4F">
                                                <a-icon type="delete"></a-icon>删除
                                            </span>
                                        </a-menu-item>
                                    </a-menu>
                                </a-dropdown>
                            </template>
                            <template slot="enable" slot-scope="text, tunnel">
                                <a-switch v-model="tunnel.enable" @change="() => switchEnable(tunnel)"></a-switch>
                            </template>
                            <template slot="mode" slot-scope="text, tunnel">
                                <a-tag :color="tunnel.mode === 'portal' ? 'purple' : 'blue'">[[ tunnel.mode === 'portal' ? 'Portal' : '直连' ]]</a-tag>
                            </template>
                            <template slot="local" slot-scope="text, tunnel">
                                <a-tag color="blue">[[ tunnel.listen || '0.0.0.0' ]]:[[ tunnel.listenPort ]]</a-tag>
                                <a-tag color="green">[[ tunnel.network ]]</a-tag>
                            </template>
                            <template slot="target" slot-scope="text, tunnel">
                                <a-tag color="purple">[[ tunnel.targetAddress ]]:[[ tunnel.targetPort ]]</a-tag>
                            </template>
                            <template slot="remote" slot-scope="text, tunnel">
                                <a-tag color="cyan">[[ tunnel.protocol ]]</a-tag>
                                <template v-if="tunnel.mode === 'portal' && tunnel.portalTransport === 'xhttp'">
                                    <a-tag color="purple">XHTTP/H3</a-tag>
                                    <a-tag color="orange">[[ tunnel.remoteAddress ]]:[[ tunnel.remotePort ]]</a-tag>
                                </template>
                                <a-tag v-else-if="tunnel.mode === 'portal'" color="orange">监听 UDP :[[ tunnel.remotePort ]]</a-tag>
                                <a-tag v-else color="orange">[[ tunnel.remoteAddress ]]:[[ tunnel.remotePort ]]</a-tag>
                            </template>
                            <template slot="kcp" slot-scope="text, tunnel">
                                <template v-if="tunnel.mode === 'portal' && tunnel.portalTransport === 'xhttp'">
                                    <a-tag color="green">xhttp</a-tag>
                                    <a-tag color="purple">h3</a-tag>
                                </template>
                                <template v-else>
                                    <a-tag color="green">mkcp</a-tag>
                                    <a-tag :color="tunnel.kcpFinalMaskType && tunnel.kcpFinalMaskType !== 'none' ? 'purple' : 'orange'">[[ tunnel.kcpFinalMaskType || 'none' ]]</a-tag>
                                </template>
                                <a-tag color="blue">Xray 26</a-tag>
                            </template>
                            <template slot="status" slot-scope="text, tunnel">
                                <a-tooltip :title="tunnel.statusMessage || ''">
                                    <a-tag :color="tunnel.status === 'success' ? 'green' : (tunnel.status === 'failed' ? 'red' : 'default')">
                                        [[ tunnel.status === 'success' ? '成功' : (tunnel.status === 'failed' ? '失败' : '未测试') ]]
                                    </a-tag>
                                </a-tooltip>
                                <div v-if="tunnel.probeTime" style="font-size: 12px; color: #999; margin-top: 4px;">[[ tunnel.probeTime ]]</div>
                            </template>
                        </a-table>
                    </a-card>
                </transition>
            </a-spin>
        </a-layout-content>
    </a-layout>

    <a-modal v-model="modal.visible" :title="modal.title" width="900px"
             :confirm-loading="modal.confirmLoading" ok-text="保存" cancel-text="取消" @ok="saveTunnel">
        <a-form layout="vertical">
            <a-row :gutter="16">
                <a-col :xs="24" :md="8">
                    <a-form-item label="模式">
                        <a-select v-model="modal.tunnel.mode" @change="onModeChange">
                            <a-select-option value="direct">公网直连</a-select-option>
                            <a-select-option value="portal">Portal（B 主动连接）</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="8">
                    <a-form-item label="备注">
                        <a-input v-model="modal.tunnel.remark" placeholder="例如 A-to-B-SSH"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="8">
                    <a-form-item label="协议">
                        <a-select v-model="modal.tunnel.protocol" :disabled="modal.tunnel.mode === 'portal'">
                            <a-select-option value="vless">vless</a-select-option>
                            <a-select-option value="vmess">vmess</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="8">
                    <a-form-item label="启用">
                        <a-switch v-model="modal.tunnel.enable"></a-switch>
                    </a-form-item>
                </a-col>
            </a-row>

            <a-divider orientation="left">本地入口（dokodemo-door inbound）</a-divider>
            <a-row :gutter="16">
                <a-col :xs="24" :md="8">
                    <a-form-item label="监听地址">
                        <a-input v-model="modal.tunnel.listen" placeholder="0.0.0.0，留空则不写 listen"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="8">
                    <a-form-item label="监听端口">
                        <a-input type="number" v-model.number="modal.tunnel.listenPort"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="8">
                    <a-form-item label="入口网络">
                        <a-select v-model="modal.tunnel.network">
                            <a-select-option value="tcp">tcp</a-select-option>
                            <a-select-option value="udp">udp</a-select-option>
                            <a-select-option value="tcp,udp">tcp,udp</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :md="12">
                    <a-form-item label="B 端目标地址">
                        <a-input v-model="modal.tunnel.targetAddress" placeholder="例如 127.0.0.1"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="12">
                    <a-form-item label="B 端目标端口">
                        <a-input type="number" v-model.number="modal.tunnel.targetPort"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>

            <a-divider orientation="left">[[ modal.tunnel.mode === 'portal' ? 'Portal 主动连接入口' : '远端 Xray（mKCP outbound）' ]]</a-divider>
            <a-alert v-if="modal.tunnel.mode === 'portal'" type="info" show-icon style="margin-bottom: 16px;"
                     message="B 端主动连接"
                     :description="modal.tunnel.portalTransport === 'xhttp' ? 'VLESS/XHTTP 模式：B 通过 CDN 域名的 TLS/H3 主动连接；A 端只在 127.0.0.1 建立无 TLS XHTTP inbound，由 Caddy h2c 回源。' : 'VMess/mKCP 模式：A 端固定监听 0.0.0.0 UDP；B 端主动连接这个 Portal UDP 端口。'"></a-alert>
            <a-row v-if="modal.tunnel.mode === 'portal'" :gutter="16">
                <a-col :xs="24" :md="12">
                    <a-form-item label="Portal 传输">
                        <a-select v-model="modal.tunnel.portalTransport" @change="onPortalTransportChange">
                            <a-select-option value="mkcp">VMess / mKCP</a-select-option>
                            <a-select-option value="xhttp">VLESS / XHTTP / H3（CDN/Caddy）</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col v-if="modal.tunnel.mode !== 'portal' || modal.tunnel.portalTransport === 'xhttp'" :xs="24" :md="12">
                    <a-form-item :label="modal.tunnel.mode === 'portal' ? 'CDN 域名' : '远端地址'">
                        <a-input v-model.trim="modal.tunnel.remoteAddress" :placeholder="modal.tunnel.mode === 'portal' ? '例如 cdn.example.com' : 'B 端公网 IP 或域名'"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="12">
                    <a-form-item :label="modal.tunnel.mode === 'portal' && modal.tunnel.portalTransport === 'xhttp' ? 'CDN 公网端口' : (modal.tunnel.mode === 'portal' ? 'Portal mKCP UDP 端口' : '远端 mKCP 端口')">
                        <a-input type="number" v-model.number="modal.tunnel.remotePort"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row v-if="modal.tunnel.mode === 'portal' && modal.tunnel.portalTransport === 'xhttp'" :gutter="16">
                <a-col :xs="24" :md="12">
                    <a-form-item label="A 端 XHTTP 本地端口">
                        <a-input type="number" v-model.number="modal.tunnel.portalListenPort"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="12">
                    <a-form-item label="XHTTP 路径">
                        <a-input v-model.trim="modal.tunnel.xhttpPath" placeholder="/portal-xhttp"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-alert v-if="modal.tunnel.mode === 'portal' && modal.tunnel.portalTransport === 'xhttp'" type="warning" show-icon style="margin-bottom: 16px;"
                     message="Caddy 必须把此路径反代到本地 Portal 端口"
                     :description="'路径 ' + modal.tunnel.xhttpPath + '* → reverse_proxy h2c://127.0.0.1:' + modal.tunnel.portalListenPort + '；B 端使用 ' + modal.tunnel.remoteAddress + ':' + modal.tunnel.remotePort + '、TLS、ALPN=h3、mode=packet-up。'"></a-alert>
            <a-row :gutter="16">
                <a-col :xs="24" :md="20">
                    <a-form-item label="UUID">
                        <a-input v-model="modal.tunnel.uuid"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="4">
                    <a-form-item label=" ">
                        <a-button block @click="modal.tunnel.uuid = RandomUtil.randomUUID()">生成</a-button>
                    </a-form-item>
                </a-col>
            </a-row>

            <template v-if="modal.tunnel.mode !== 'portal' || modal.tunnel.portalTransport === 'mkcp'">
            <a-divider orientation="left">mKCP 参数</a-divider>
            <a-alert type="warning" show-icon style="margin-bottom: 16px;"
                     message="mKCP 参数会生成 Xray 26 配置"
                     description="这里只生成 kcpSettings 和 finalmask.udp；不会写入旧版 kcpSettings.header/seed。A、B 两端参数必须手工保持一致。"></a-alert>
            <a-row :gutter="16">
                <a-col :xs="24" :md="24">
                    <a-form-item label="FinalMask UDP header">
                        <a-select v-model="modal.tunnel.kcpFinalMaskType">
                            <a-select-option value="none">none</a-select-option>
                            <a-select-option value="header-srtp">header-srtp</a-select-option>
                            <a-select-option value="header-utp">header-utp</a-select-option>
                            <a-select-option value="header-wechat">header-wechat</a-select-option>
                            <a-select-option value="header-dtls">header-dtls</a-select-option>
                            <a-select-option value="header-wireguard">header-wireguard</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :md="6">
                    <a-form-item label="mtu">
                        <a-input type="number" v-model.number="modal.tunnel.kcpMtu"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="6">
                    <a-form-item label="tti (ms)">
                        <a-input type="number" v-model.number="modal.tunnel.kcpTti"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="6">
                    <a-form-item label="uplink capacity (MB/S)">
                        <a-input type="number" v-model.number="modal.tunnel.kcpUplinkCapacity"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="6">
                    <a-form-item label="downlink capacity (MB/S)">
                        <a-input type="number" v-model.number="modal.tunnel.kcpDownlinkCapacity"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :md="6">
                    <a-form-item label="congestion">
                        <a-switch v-model="modal.tunnel.kcpCongestion"></a-switch>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="9">
                    <a-form-item label="read buffer size (MB)">
                        <a-input type="number" v-model.number="modal.tunnel.kcpReadBufferSize"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :md="9">
                    <a-form-item label="write buffer size (MB)">
                        <a-input type="number" v-model.number="modal.tunnel.kcpWriteBufferSize"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>
            </template>
        </a-form>
    </a-modal>
</a-layout>
{{template "js" .}}
<script>
    const columns = [{
        title: "操作",
        align: 'center',
        width: 70,
        scopedSlots: { customRender: 'action' },
    }, {
        title: "启用",
        align: 'center',
        width: 60,
        scopedSlots: { customRender: 'enable' },
    }, {
        title: "模式",
        align: 'center',
        width: 90,
        scopedSlots: { customRender: 'mode' },
    }, {
        title: "id",
        align: 'center',
        dataIndex: "id",
        width: 60,
    }, {
        title: "备注",
        align: 'center',
        dataIndex: "remark",
        width: 140,
    }, {
        title: "本地入口",
        align: 'center',
        width: 180,
        scopedSlots: { customRender: 'local' },
    }, {
        title: "目标",
        align: 'center',
        width: 180,
        scopedSlots: { customRender: 'target' },
    }, {
        title: "远端 / Portal",
        align: 'center',
        width: 220,
        scopedSlots: { customRender: 'remote' },
    }, {
        title: "传输",
        align: 'center',
        width: 180,
        scopedSlots: { customRender: 'kcp' },
    }, {
        title: "最近一次 TCP 探测",
        align: 'center',
        width: 170,
        scopedSlots: { customRender: 'status' },
    }];

    function newTunnel(data = {}) {
        const tunnel = Object.assign({
            id: 0,
            enable: true,
            mode: 'direct',
            remark: '',
            listen: '0.0.0.0',
            listenPort: 0,
            network: 'tcp',
            targetAddress: '127.0.0.1',
            targetPort: 0,
            remoteAddress: '',
            remotePort: 0,
            protocol: 'vmess',
            uuid: RandomUtil.randomUUID(),
            portalTransport: 'mkcp',
            portalListenPort: 0,
            xhttpPath: '/portal-xhttp',
            kcpFinalMaskType: 'none',
            kcpMtu: 1350,
            kcpTti: 20,
            kcpUplinkCapacity: 5,
            kcpDownlinkCapacity: 20,
            kcpCongestion: false,
            kcpReadBufferSize: 2,
            kcpWriteBufferSize: 2,
            status: 'not_tested',
            statusMessage: '尚未进行 TCP 探测',
            probeTime: '',
        }, data || {});
        if (!tunnel.mode) tunnel.mode = 'direct';
        if (!tunnel.portalTransport) tunnel.portalTransport = 'mkcp';
        if (!tunnel.xhttpPath) tunnel.xhttpPath = '/portal-xhttp';
        return tunnel;
    }

    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            siderDrawer,
            spinning: false,
            columns,
            tunnels: [],
            modal: {
                visible: false,
                title: '',
                confirmLoading: false,
                tunnel: newTunnel(),
            },
        },
        methods: {
            loading(spinning = true) {
                this.spinning = spinning;
            },
            async getTunnels() {
                this.loading(true);
                const msg = await HttpUtil.post('/xui/tunnel/list');
                this.loading(false);
                if (!msg.success) return;
                this.tunnels = (msg.obj || []).map(tunnel => newTunnel(tunnel));
            },
            openAddTunnel() {
                this.modal.title = '添加隧道';
                this.modal.tunnel = newTunnel();
                this.modal.visible = true;
            },
            openEditTunnel(tunnel) {
                this.modal.title = '修改隧道';
                this.modal.tunnel = newTunnel(JSON.parse(JSON.stringify(tunnel)));
                this.modal.visible = true;
            },
            onModeChange(mode) {
                if (mode === 'portal') {
                    this.onPortalTransportChange(this.modal.tunnel.portalTransport || 'mkcp');
                }
            },
            onPortalTransportChange(transport) {
                this.modal.tunnel.portalTransport = transport;
                if (transport === 'xhttp') {
                    this.modal.tunnel.protocol = 'vless';
                    if (!this.modal.tunnel.remotePort || this.modal.tunnel.remotePort === 40000) this.modal.tunnel.remotePort = 443;
                    if (!this.modal.tunnel.portalListenPort) this.modal.tunnel.portalListenPort = 26418;
                    if (!this.modal.tunnel.xhttpPath || this.modal.tunnel.xhttpPath === '/') {
                        this.modal.tunnel.xhttpPath = '/portal-xhttp';
                    }
                } else {
                    this.modal.tunnel.protocol = 'vmess';
                    if (!this.modal.tunnel.remotePort || this.modal.tunnel.remotePort === 443) this.modal.tunnel.remotePort = 40000;
                    if (!this.modal.tunnel.portalListenPort) this.modal.tunnel.portalListenPort = this.modal.tunnel.remotePort;
                }
            },
            clickAction(action, tunnel) {
                switch (action.key) {
                    case 'edit':
                        this.openEditTunnel(tunnel);
                        break;
                    case 'test':
                        this.testTunnel(tunnel);
                        break;
                    case 'delete':
                        this.delTunnel(tunnel);
                        break;
                }
            },
            async saveTunnel() {
                this.modal.confirmLoading = true;
                const tunnel = this.modal.tunnel;
                let msg;
                if (tunnel.id > 0) {
                    msg = await HttpUtil.post(`/xui/tunnel/update/${tunnel.id}`, tunnel);
                } else {
                    msg = await HttpUtil.post('/xui/tunnel/add', tunnel);
                }
                this.modal.confirmLoading = false;
                if (msg.success) {
                    this.modal.visible = false;
                    await this.getTunnels();
                }
            },
            async switchEnable(tunnel) {
                const msg = await HttpUtil.post(`/xui/tunnel/update/${tunnel.id}`, tunnel);
                if (!msg.success) tunnel.enable = !tunnel.enable;
            },
            async testTunnel(tunnel) {
                this.loading(true);
                const msg = await HttpUtil.post(`/xui/tunnel/test/${tunnel.id}`);
                this.loading(false);
                if (msg.success && msg.obj) Object.assign(tunnel, newTunnel(msg.obj));
            },
            async applyTunnels() {
                this.loading(true);
                await HttpUtil.post('/xui/tunnel/apply');
                this.loading(false);
                await this.getTunnels();
            },
            async delTunnel(tunnel) {
                await new Promise(resolve => {
                    this.$confirm({
                        title: '删除隧道',
                        content: `确定删除隧道 ${tunnel.remark || tunnel.id} 吗？`,
                        okText: '删除',
                        okType: 'danger',
                        cancelText: '取消',
                        onOk: () => resolve(),
                    });
                });
                this.loading(true);
                const msg = await HttpUtil.post(`/xui/tunnel/del/${tunnel.id}`);
                this.loading(false);
                if (msg.success) await this.getTunnels();
            },
        },
        async mounted() {
            await this.getTunnels();
        },
    });
</script>
</body>
</html>
