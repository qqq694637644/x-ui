name: CI

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: true

      - name: Show Go version
        run: go version

      - name: Check gofmt
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -z "$changed" ]; then
            exit 0
          fi
          files="$(gofmt -l $changed)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

  portal-smoke:
    name: Actual x-ui A + b_client_xray B smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout x-ui
        uses: actions/checkout@v4

      - name: Checkout pinned b_client_xray generator
        uses: actions/checkout@v4
        with:
          repository: qqq694637644/b_client_xray
          ref: 1c33864eeeffc2c5305aab4ca8f0796586b571ae
          path: .build/b_client_xray

      - name: Checkout pinned Xray-core
        uses: actions/checkout@v4
        with:
          repository: qqq694637644/Xray-core
          ref: d2758a023cd7f4174a5a5fa4ff66e487d4342ba0
          path: .build/xray-core-v26.3.27

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          # The smoke job also compiles the pinned Xray-core repository.
          # Share its Go module/build cache with release.yml (same Go version
          # and dependency files). The Go 1.20 job above keeps its own cache.
          cache: true
          cache-dependency-path: |
            go.sum
            .build/xray-core-v26.3.27/go.sum

      - name: Report Go cache reuse
        run: echo "Go 1.26 build/module cache hit=${{ steps.setup-go.outputs.cache-hit }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .build/b_client_xray/requirements.txt

      - name: Install B generator dependencies
        run: python -m pip install -r .build/b_client_xray/requirements.txt

      - name: Restore pinned Xray binary for smoke tests
        id: xray-binary-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xray-v26.3.27
          # CI-only executable cache; releases always rebuild from pinned source.
          # No restore-keys: compiler flags, Go version and source must all match.
          key: xray-ci-linux-amd64-go1.26.8-cgo0-strip-d2758a023cd7f4174a5a5fa4ff66e487d4342ba0-${{ hashFiles('.build/xray-core-v26.3.27/go.mod', '.build/xray-core-v26.3.27/go.sum') }}

      - name: Build pinned Xray
        if: steps.xray-binary-cache.outputs.cache-hit != 'true'
        run: |
          cd .build/xray-core-v26.3.27
          # Match release.yml's build flags to maximize shared GOCACHE reuse.
          time CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/xray-v26.3.27" ./main

      - name: Verify pinned Xray executable
        run: |
          chmod +x "$RUNNER_TEMP/xray-v26.3.27"
          "$RUNNER_TEMP/xray-v26.3.27" version | tee "$RUNNER_TEMP/xray-version.txt"
          grep -Fq 'Xray 26.3.27' "$RUNNER_TEMP/xray-version.txt"
          grep -Fq 'd2758a0' "$RUNNER_TEMP/xray-version.txt"

      - name: Validate managed endpoint health-check config with pinned Xray
        env:
          XUI_HEALTHCHECK_XRAY_BIN: ${{ runner.temp }}/xray-v26.3.27
        run: go test ./web/service -run TestEndpointHealthCheckConfigAcceptedByConfiguredXray -count=1

      - name: Generate A config with x-ui production generator
        run: |
          go run ./cmd/portal-fixture \
            --output "$RUNNER_TEMP/xui-a.json" \
            --business-port 18081 \
            --portal-port 40000 \
            --target-port 19090 \
            --uuid my-home-xray

      - name: Run actual A/B TCP/UDP Portal smoke
        working-directory: .build/b_client_xray
        run: |
          python scripts/smoke_portal.py \
            --xray "$RUNNER_TEMP/xray-v26.3.27" \
            --a-config "$RUNNER_TEMP/xui-a.json" \
            --uuid my-home-xray
