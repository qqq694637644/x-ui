name: RSX3 WARP DATAGRAM

on:
  push:
    branches:
      - gpt/xtcp-reverse-socks-exit
  pull_request:
    branches:
      - main

jobs:
  exit-panel:
    name: Go exit / Web panel / Python SOCKS5 interoperability
    runs-on: ubuntu-latest
    env:
      NAT_NODE_DIAGNOSTICS_SHA: aa7aa6810c02c5dcb27ec9edd23afb35936d391f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test RSX3 Go Agent and Web configuration
        run: go test -count=1 ./reverseexit ./web/service -run 'TestExitRequiresWARPAndLoopbackOnly|TestWARPHealthProbeChecksTCPAndUDPSeparately|TestManagerTracksXTCPAndWARPIndependently|TestTargetSOCKSSeparatedFromWARPTransportAndDefault|TestConfiguredTargetFailureNeverFallsBackToWARP|TestTargetSOCKSRejectsNonLocalAndMismatchedCredentials|TestTargetSOCKSIndependentXrayAuthentication|TestReverseSocksWebConfigSecretsAndLifecycle|TestReverseSocksManagedFRPCVerifyLifecycleAndIsolation|TestManagedFRPCOptionalRestartLogs|TestFRPCLogBufferBounded|TestManagedFRPCUserAndVisitorNameRender|TestManagedFRPCBrutalRendersAtRootAndVerifiesCapability|TestManagedFRPCBrutalFormRoundTripAndView|TestManagedFRPCWithoutDatabase|TestManagedFRPCRealForkPrivacyValidation|TestReverseSocksSavedSettingsPreserveManagedFRPCFields|TestReverseSocksFormUsesCurrentSTUNAndClearsSecrets|TestReverseSocksProtocolSelectionIsExplicit|TestRSXWriter'
      - name: Check Web frpc WARP and independent Xray target SOCKS5 bindings
        run: node web/html/xui/test_reverse_socks_frpc_fields.cjs
      - name: Build private frpc fork and verify its fail-closed XTCP capabilities
        run: |
          # Prior private frpc work has merged into dev.
          git clone --depth 1 --branch dev \
            https://github.com/qqq694637644/frp.git "$RUNNER_TEMP/frp"
          cd "$RUNNER_TEMP/frp"
          CGO_ENABLED=0 go build -tags 'frpc,noweb' -o "$RUNNER_TEMP/frpc-private" ./cmd/frpc
          cd "$GITHUB_WORKSPACE"
          REVERSE_SOCKS_TEST_REAL_FRPC_BIN="$RUNNER_TEMP/frpc-private" \
            go test -count=1 ./web/service -run '^TestManagedFRPCRealForkPrivacyValidation$'
      - name: Build full x-ui Linux panel and Go exit agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/xui-panel" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/reverse-socks-exit" ./cmd/reverse-socks-exit
          (cd "$RUNNER_TEMP" && sha256sum xui-panel reverse-socks-exit > rsx3.sha256)
      - name: Upload x-ui Linux panel and RSX3 Go Agent
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-rsx3-panel-agent-linux-amd64
          path: |
            ${{ runner.temp }}/xui-panel
            ${{ runner.temp }}/reverse-socks-exit
            ${{ runner.temp }}/rsx3.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Get Python 3.13 NAT node companion
        run: |
          # Pin the new RSX3-only Python to the Go Agent's strict diagnostics
          # capability version. Never fetch a legacy main fallback.
          git init "$RUNNER_TEMP/nat_node"
          git -C "$RUNNER_TEMP/nat_node" remote add origin https://github.com/qqq694637644/nat_node.git
          git -C "$RUNNER_TEMP/nat_node" fetch --depth 1 origin "$NAT_NODE_DIAGNOSTICS_SHA"
          git -C "$RUNNER_TEMP/nat_node" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nat_node" rev-parse HEAD)" = "$NAT_NODE_DIAGNOSTICS_SHA"
      - name: Run Python/Go actual agent against fake WARP SOCKS5
        working-directory: ${{ runner.temp }}/nat_node
        env:
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
        run: python -m unittest -v tests.test_protocol tests.test_scheduler tests.test_end_to_end
